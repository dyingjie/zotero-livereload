name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test
        run: npm test
      - name: Build XPI
        run: npm run build
      - name: Validate version and prepare notes
        shell: pwsh
        run: node scripts/release-notes.cjs $env:GITHUB_REF_NAME
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $asset = "dist/zotero-livereload-$version.xpi"
          gh release create $env:GITHUB_REF_NAME $asset --verify-tag --title "Zotero LiveReload $version" --notes-file dist/release-notes.md --latest
